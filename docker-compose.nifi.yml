services:
  nifi:
    image: apache/nifi:1.21.0
    container_name: nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_JVM_HEAP: "1g"
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "Admin123!nifi"
      # NiFi подключается к Kafka по SASL_SSL; доверенный CA Yandex монтируется ниже.
      NIFI_PROPS_LISTEN_HOST: "0.0.0.0"
    volumes:
      - ./nifi-certs/nifi-truststore.jks:/opt/nifi/certs/nifi-truststore.jks:ro
      - ./YandexInternalRootCA.crt:/opt/nifi/certs/YandexInternalRootCA.crt:ro
    restart: unless-stopped
