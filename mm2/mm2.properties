# MirrorMaker 2: зеркалирование топиков products и client_requests
# из основного кластера (primary) в резервный (backup).
# Используется клиентский сертификат User:admin (суперпользователь в обоих кластерах).

clusters = primary, backup

primary.bootstrap.servers = kafka1:9095,kafka2:9096,kafka3:9097
backup.bootstrap.servers  = backup1:9195,backup2:9196,backup3:9197

# TLS к основному кластеру
primary.security.protocol = SSL
primary.ssl.truststore.location = /etc/kafka/secrets/client.truststore.jks
primary.ssl.truststore.password = kafka123
primary.ssl.keystore.location = /etc/kafka/secrets/client.admin.keystore.jks
primary.ssl.keystore.password = kafka123
primary.ssl.key.password = kafka123
primary.ssl.endpoint.identification.algorithm =

# TLS к резервному кластеру
backup.security.protocol = SSL
backup.ssl.truststore.location = /etc/kafka/secrets/client.truststore.jks
backup.ssl.truststore.password = kafka123
backup.ssl.keystore.location = /etc/kafka/secrets/client.admin.keystore.jks
backup.ssl.keystore.password = kafka123
backup.ssl.key.password = kafka123
backup.ssl.endpoint.identification.algorithm =

# Что реплицируем
primary->backup.enabled = true
primary->backup.topics = products,client_requests
primary->backup.groups = .*
primary->backup.replication.factor = 3

# Не дублируем ACL (управляются отдельно в каждом кластере)
sync.topic.acls.enabled = false

# Внутренние топики MM2
replication.factor = 3
tasks.max = 3
emit.heartbeats.enabled = true
emit.heartbeats.interval.seconds = 5
