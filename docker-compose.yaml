services:
  kafka1:
    image: kafka-jmx:7.5.0
    build:
      context: ./kafka-jmx
    command: ["/bin/bash", "-c", "export KAFKA_OPTS='-javaagent:/opt/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter_config.yaml'; exec /etc/confluent/docker/run"]
    hostname: kafka1
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_EARLY_START_LISTENERS: CONTROLLER
      CLUSTER_ID: _J-6FEdzRW6FrSRnHsT11g
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,SSL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka1:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      # --- SSL ---
      KAFKA_SSL_KEYSTORE_FILENAME: kafka1.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: credentials
      KAFKA_SSL_KEY_CREDENTIALS: credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: credentials
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$/$1/L
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      # --- Авторизация (ACL) ---
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: false
      KAFKA_SUPER_USERS: User:admin;User:kafka1;User:kafka2;User:kafka3;User:ANONYMOUS
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
      - ./ssl/config:/etc/kafka/ssl-config:ro
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9095", "--command-config", "/etc/kafka/ssl-config/admin.properties", "--list"]
      interval: 10s
      timeout: 15s
      retries: 30

  kafka2:
    image: kafka-jmx:7.5.0
    build:
      context: ./kafka-jmx
    command: ["/bin/bash", "-c", "export KAFKA_OPTS='-javaagent:/opt/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter_config.yaml'; exec /etc/confluent/docker/run"]
    hostname: kafka2
    ports:
      - "9096:9096"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_EARLY_START_LISTENERS: CONTROLLER
      CLUSTER_ID: _J-6FEdzRW6FrSRnHsT11g
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,SSL://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka2:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      # --- SSL ---
      KAFKA_SSL_KEYSTORE_FILENAME: kafka2.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: credentials
      KAFKA_SSL_KEY_CREDENTIALS: credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: credentials
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$/$1/L
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      # --- Авторизация (ACL) ---
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: false
      KAFKA_SUPER_USERS: User:admin;User:kafka1;User:kafka2;User:kafka3;User:ANONYMOUS
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
      - ./ssl/config:/etc/kafka/ssl-config:ro
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9096", "--command-config", "/etc/kafka/ssl-config/admin.properties", "--list"]
      interval: 10s
      timeout: 15s
      retries: 30

  kafka3:
    image: kafka-jmx:7.5.0
    build:
      context: ./kafka-jmx
    command: ["/bin/bash", "-c", "export KAFKA_OPTS='-javaagent:/opt/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter_config.yaml'; exec /etc/confluent/docker/run"]
    hostname: kafka3
    ports:
      - "9097:9097"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_EARLY_START_LISTENERS: CONTROLLER
      CLUSTER_ID: _J-6FEdzRW6FrSRnHsT11g
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,SSL://0.0.0.0:9097
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka3:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      # --- SSL ---
      KAFKA_SSL_KEYSTORE_FILENAME: kafka3.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: credentials
      KAFKA_SSL_KEY_CREDENTIALS: credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: credentials
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$/$1/L
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      # --- Авторизация (ACL) ---
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: false
      KAFKA_SUPER_USERS: User:admin;User:kafka1;User:kafka2;User:kafka3;User:ANONYMOUS
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
      - ./ssl/config:/etc/kafka/ssl-config:ro
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9097", "--command-config", "/etc/kafka/ssl-config/admin.properties", "--list"]
      interval: 10s
      timeout: 15s
      retries: 30

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on:
      kafka1:
        condition: service_healthy
    volumes:
      - ./producer:/app
      - ./ssl/certs:/etc/kafka/secrets:ro
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - BOOTSTRAP_SERVERS=kafka1:9095,kafka2:9096,kafka3:9097
      - TOPIC=topic-1
      - SECURITY_PROTOCOL=SSL
      - SSL_CAFILE=/etc/kafka/secrets/ca-cert
      - SSL_CERTFILE=/etc/kafka/secrets/client.producer-cert.pem
      - SSL_KEYFILE=/etc/kafka/secrets/client.producer-key.pem
      - SSL_CHECK_HOSTNAME=false
    command: python -u producer.py
    networks:
      - kafka-network
    restart: on-failure

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    depends_on:
      kafka1:
        condition: service_healthy
    volumes:
      - ./consumer:/app
      - ./ssl/certs:/etc/kafka/secrets:ro
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - BOOTSTRAP_SERVERS=kafka1:9095,kafka2:9096,kafka3:9097
      - TOPIC=topic-1
      - GROUP_ID=ssl-consumer-group
      - SECURITY_PROTOCOL=SSL
      - SSL_CAFILE=/etc/kafka/secrets/ca-cert
      - SSL_CERTFILE=/etc/kafka/secrets/client.consumer-cert.pem
      - SSL_KEYFILE=/etc/kafka/secrets/client.consumer-key.pem
      - SSL_CHECK_HOSTNAME=false
      - STARTUP_DELAY=10
    command: python -u consumer.py
    networks:
      - kafka-network
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Аналитическая платформа маркетплейса
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16
    container_name: marketplace-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=marketplace
      - POSTGRES_PASSWORD=marketplace
      - POSTGRES_DB=marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 10s
      timeout: 15s
      retries: 10

  # SHOP API: эмуляция магазина — читает файл и шлёт товары в Kafka (topic products)
  shop-api:
    build:
      context: .
      dockerfile: shop_api/Dockerfile
    depends_on:
      kafka1:
        condition: service_healthy
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
    environment:
      - PYTHONUNBUFFERED=1
      - BOOTSTRAP_SERVERS=kafka1:9095,kafka2:9096,kafka3:9097
      - TOPIC=products
      - SECURITY_PROTOCOL=SSL
      - SSL_CAFILE=/etc/kafka/secrets/ca-cert
      - SSL_CERTFILE=/etc/kafka/secrets/client.producer-cert.pem
      - SSL_KEYFILE=/etc/kafka/secrets/client.producer-key.pem
      - SSL_CHECK_HOSTNAME=false
      - SEND_INTERVAL=60
    networks:
      - kafka-network
    restart: on-failure

  # product-sink: консьюмер Kafka (topic products) -> PostgreSQL
  product-sink:
    build:
      context: .
      dockerfile: product_sink/Dockerfile
    depends_on:
      kafka1:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
    environment:
      - PYTHONUNBUFFERED=1
      - BOOTSTRAP_SERVERS=kafka1:9095,kafka2:9096,kafka3:9097
      - TOPIC=products-allowed
      - GROUP_ID=product-sink-group
      - SECURITY_PROTOCOL=SSL
      - SSL_CAFILE=/etc/kafka/secrets/ca-cert
      - SSL_CERTFILE=/etc/kafka/secrets/client.consumer-cert.pem
      - SSL_KEYFILE=/etc/kafka/secrets/client.consumer-key.pem
      - SSL_CHECK_HOSTNAME=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=marketplace
      - POSTGRES_USER=marketplace
      - POSTGRES_PASSWORD=marketplace
    networks:
      - kafka-network
    restart: on-failure

  # ===== forbidden-filter: потоковая фильтрация запрещённых товаров (Faust, Шаг 4) =====
  forbidden-filter:
    build:
      context: ./forbidden_filter
      dockerfile: Dockerfile
    depends_on:
      kafka1:
        condition: service_healthy
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
    environment:
      - PYTHONUNBUFFERED=1
      - BOOTSTRAP_SERVERS=kafka1:9095,kafka2:9096,kafka3:9097
      - SSL_CAFILE=/etc/kafka/secrets/ca-cert
      - SSL_CERTFILE=/etc/kafka/secrets/client.producer-cert.pem
      - SSL_KEYFILE=/etc/kafka/secrets/client.producer-key.pem
      - SSL_CHECK_HOSTNAME=false
      - PRODUCTS_TOPIC=products
      - FORBIDDEN_TOPIC=forbidden-products
      - ALLOWED_TOPIC=products-allowed
      - REJECTED_TOPIC=products-rejected
    command: ["faust", "-A", "faust_app", "worker", "--loglevel=info"]
    networks:
      - kafka-network
    restart: on-failure

  # CLIENT API: терминал (поиск товаров, рекомендации); запросы -> Kafka + PostgreSQL
  client-api:
    build:
      context: .
      dockerfile: client_api/Dockerfile
    depends_on:
      kafka1:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
    environment:
      - PYTHONUNBUFFERED=1
      - BOOTSTRAP_SERVERS=kafka1:9095,kafka2:9096,kafka3:9097
      - TOPIC=client_requests
      - SECURITY_PROTOCOL=SSL
      - SSL_CAFILE=/etc/kafka/secrets/ca-cert
      - SSL_CERTFILE=/etc/kafka/secrets/client.producer-cert.pem
      - SSL_KEYFILE=/etc/kafka/secrets/client.producer-key.pem
      - SSL_CHECK_HOSTNAME=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=marketplace
      - POSTGRES_USER=marketplace
      - POSTGRES_PASSWORD=marketplace
    stdin_open: true
    tty: true
    networks:
      - kafka-network
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Второй (резервный) Kafka-кластер для зеркалирования (Шаг 2, отказоустойчивость)
  # Переиспользуются сертификаты kafka{1..3}, поэтому hostname-проверка отключена
  # (KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM="").
  # ---------------------------------------------------------------------------
  backup1:
    image: kafka-jmx:7.5.0
    build:
      context: ./kafka-jmx
    command: ["/bin/bash", "-c", "export KAFKA_OPTS='-javaagent:/opt/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter_config.yaml'; exec /etc/confluent/docker/run"]
    hostname: backup1
    ports:
      - "9195:9195"
    environment:
      KAFKA_NODE_ID: 11
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_EARLY_START_LISTENERS: CONTROLLER
      CLUSTER_ID: Bk9mLm3RtQ2pXyZ7WvE5aF
      KAFKA_CONTROLLER_QUORUM_VOTERS: 11@backup1:9193,12@backup2:9193,13@backup3:9193
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9193,SSL://0.0.0.0:9195
      KAFKA_ADVERTISED_LISTENERS: SSL://backup1:9195
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_SSL_KEYSTORE_FILENAME: kafka1.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: credentials
      KAFKA_SSL_KEY_CREDENTIALS: credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: credentials
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$/$1/L
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: false
      KAFKA_SUPER_USERS: User:admin;User:kafka1;User:kafka2;User:kafka3;User:ANONYMOUS
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
      - ./ssl/config:/etc/kafka/ssl-config:ro
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9195", "--command-config", "/etc/kafka/ssl-config/admin-backup.properties", "--list"]
      interval: 10s
      timeout: 15s
      retries: 30

  backup2:
    image: kafka-jmx:7.5.0
    build:
      context: ./kafka-jmx
    command: ["/bin/bash", "-c", "export KAFKA_OPTS='-javaagent:/opt/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter_config.yaml'; exec /etc/confluent/docker/run"]
    hostname: backup2
    environment:
      KAFKA_NODE_ID: 12
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_EARLY_START_LISTENERS: CONTROLLER
      CLUSTER_ID: Bk9mLm3RtQ2pXyZ7WvE5aF
      KAFKA_CONTROLLER_QUORUM_VOTERS: 11@backup1:9193,12@backup2:9193,13@backup3:9193
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9193,SSL://0.0.0.0:9196
      KAFKA_ADVERTISED_LISTENERS: SSL://backup2:9196
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_SSL_KEYSTORE_FILENAME: kafka2.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: credentials
      KAFKA_SSL_KEY_CREDENTIALS: credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: credentials
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$/$1/L
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: false
      KAFKA_SUPER_USERS: User:admin;User:kafka1;User:kafka2;User:kafka3;User:ANONYMOUS
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
      - ./ssl/config:/etc/kafka/ssl-config:ro
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9196", "--command-config", "/etc/kafka/ssl-config/admin-backup.properties", "--list"]
      interval: 10s
      timeout: 15s
      retries: 30

  backup3:
    image: kafka-jmx:7.5.0
    build:
      context: ./kafka-jmx
    command: ["/bin/bash", "-c", "export KAFKA_OPTS='-javaagent:/opt/jmx_prometheus_javaagent.jar=7071:/opt/jmx_exporter_config.yaml'; exec /etc/confluent/docker/run"]
    hostname: backup3
    environment:
      KAFKA_NODE_ID: 13
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_EARLY_START_LISTENERS: CONTROLLER
      CLUSTER_ID: Bk9mLm3RtQ2pXyZ7WvE5aF
      KAFKA_CONTROLLER_QUORUM_VOTERS: 11@backup1:9193,12@backup2:9193,13@backup3:9193
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9193,SSL://0.0.0.0:9197
      KAFKA_ADVERTISED_LISTENERS: SSL://backup3:9197
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_SSL_KEYSTORE_FILENAME: kafka3.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: credentials
      KAFKA_SSL_KEY_CREDENTIALS: credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: credentials
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*?),.*$/$1/L
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: false
      KAFKA_SUPER_USERS: User:admin;User:kafka1;User:kafka2;User:kafka3;User:ANONYMOUS
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
      - ./ssl/config:/etc/kafka/ssl-config:ro
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9197", "--command-config", "/etc/kafka/ssl-config/admin-backup.properties", "--list"]
      interval: 10s
      timeout: 15s
      retries: 30

  # MirrorMaker 2: дублирование products/client_requests из primary -> backup
  mirror-maker:
    image: confluentinc/cp-kafka:7.5.0
    entrypoint: ["/bin/bash", "-c", "exec kafka-run-class org.apache.kafka.connect.mirror.MirrorMaker /etc/kafka/mm2.properties"]
    depends_on:
      kafka1:
        condition: service_healthy
      backup1:
        condition: service_healthy
    volumes:
      - ./ssl/certs:/etc/kafka/secrets:ro
      - ./mm2/mm2.properties:/etc/kafka/mm2.properties:ro
    environment:
      - KAFKA_LOG4J_OPTS=-Dlog4j.configuration=file:/etc/kafka/connect-log4j.properties
    networks:
      - kafka-network
    restart: on-failure

  # ===== HDFS для хранения аналитики =====
  hdfs-namenode:
    image: apache/hadoop:3.3.6
    container_name: hdfs-namenode
    hostname: hdfs-namenode
    user: root
    command: ["bash", "-c", "if [ ! -f /hadoop/dfs/name/current/VERSION ]; then hdfs namenode -format -force; fi; hdfs namenode"]
    environment:
      - HDFS_NAMENODE_USER=root
      - HDFS_DATANODE_USER=root
    ports:
      - "9870:9870"  # Web UI
      - "8020:8020"  # RPC
    volumes:
      - ./hdfs/namenode:/hadoop/dfs/name
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks:
      - kafka-network

  hdfs-datanode:
    image: apache/hadoop:3.3.6
    container_name: hdfs-datanode
    hostname: hdfs-datanode
    user: root
    command: ["hdfs", "datanode"]
    environment:
      - HDFS_NAMENODE_USER=root
      - HDFS_DATANODE_USER=root
    volumes:
      - ./hdfs/datanode:/hadoop/dfs/data
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      - hdfs-namenode
    networks:
      - kafka-network

  # ===== Spark Analytics =====
  spark-analytics:
    build:
      context: ./spark-analytics
      dockerfile: Dockerfile
    container_name: spark-analytics
    hostname: spark-analytics
    environment:
      - KAFKA_BOOTSTRAP=backup1:9195,backup2:9196,backup3:9197
      - PYSPARK_PYTHON=python3
      - PYTHONUNBUFFERED=1
    volumes:
      - ./spark-analytics:/opt/spark-apps:ro
      - ./ssl/certs:/opt/bitnami/spark/ssl/certs:ro
      - ./data:/opt/bitnami/spark/data:ro
      - spark-analytics-checkpoint:/opt/spark/checkpoint-spark-analytics
    depends_on:
      - backup1
      - backup2
      - backup3
      - hdfs-namenode
      - hdfs-datanode
    restart: on-failure
    networks:
      - kafka-network

  # ---------------------------------------------------------------------------
  # Мониторинг (Шаг 6): JMX Exporter уже вшит в брокеры (kafka-jmx образ),
  # здесь — Prometheus, Alertmanager, Grafana и локальный webhook-приёмник.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - kafka-network
    restart: on-failure

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - kafka-network
    restart: on-failure

  alert-webhook:
    image: python:3.11-slim
    container_name: alert-webhook
    working_dir: /app
    volumes:
      - ./monitoring/alert-webhook:/app
    command: ["python", "webhook.py", "5050"]
    ports:
      - "5050:5050"
    networks:
      - kafka-network
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - kafka-network
    restart: on-failure

networks:
  kafka-network:
    driver: bridge

volumes:
  postgres_data:
  spark-analytics-checkpoint:
